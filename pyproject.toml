[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "memory-agent-factory"
version = "0.1.0"
description = "An auditable agent workflow that produces and validates technical-memory retrieval plugins"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=1.0,<2", "pydantic>=2.10,<3", "httpx>=0.28,<1",
  "scikit-learn>=1.6,<2", "networkx>=3.4,<4"
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-xdist>=3,<4", "ruff>=0.11,<1"]
api = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1"]

[project.scripts]
agent-factory = "agent_factory.cli:main"

[tool.setuptools.package-data]
agent_factory = ["templates/*.py", "web/*.html", "web/*.css", "web/*.js"]
"agent_factory.plugins.algorithms" = ["materials/*.md"]

[tool.setuptools.packages.find]
include = ["agent_factory*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
